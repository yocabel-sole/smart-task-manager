{% extends 'tasks/base.html' %}

{% block title %}Delete Task · Smart Task Manager{% endblock %}

{% block content %}
<h2>Delete Task</h2>
<p>Are you sure you want to delete the task "{{ task.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'dashboard' %}">Cancel</a>
    
</form>
{% endblock %}
