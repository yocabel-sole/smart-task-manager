{% extends 'tasks/base.html' %}

{% block title %}Edit Task · Smart Task Manager{% endblock %}

{% block content %}
<h2>Edit Task: {{ task.title }}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update Task</button>
</form>
<p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
{% endblock %}
